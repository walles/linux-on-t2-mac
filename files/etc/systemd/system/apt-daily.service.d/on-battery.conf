# This laptop is always on battery while in use, so the stock
# ConditionACPower=true made this skip every single time. Run on AC or with at
# least 30% battery instead.
[Unit]
ConditionACPower=

[Service]
ExecCondition=/bin/sh -c 'systemd-ac-power || [ "$$(cat /sys/class/power_supply/BAT0/capacity)" -ge 30 ]'

# Skip when offline, so that nothing gets marked as done for today.
# "apt-get update" exits 0 even when no source is reachable. The NetworkManager
# dispatcher hook 90-apt-daily retries once we are online.
ExecCondition=/bin/sh -c '[ "$$(nmcli networking connectivity)" = full ]'
