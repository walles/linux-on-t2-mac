# Put the disk password in the initramfs so we don't have to type it at boot.
# systemd-cryptsetup picks up /etc/cryptsetup-keys.d/<volume>.key on its own.
#
# The password is "empty" and /boot isn't encrypted, so this gives no
# protection. Remove this file and the key if we ever go for a real password.
install_items+=" /etc/cryptsetup-keys.d/cryptroot.key "
