add_dracutmodules+=" crypt lvm "

# The internal keyboard sits behind the T2 chip, so its driver has to be in the
# initramfs for typing a disk password. The T2 kernel calls the driver t2bce,
# the Ubuntu kernels use the apple-bce DKMS module.
if [[ -d /lib/modules/$kernel/kernel/drivers/staging/t2bce ]]; then
  force_drivers+=" t2bce_vhci "
else
  force_drivers+=" apple-bce "
fi
