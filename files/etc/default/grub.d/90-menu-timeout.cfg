# Show the GRUB menu so we can pick an older kernel if a new one doesn't boot
GRUB_TIMEOUT_STYLE=menu

# 5s since the keyboard can take a moment to start working
GRUB_TIMEOUT=5

# The default 16px font is tiny on the retina screen. Make this one with:
# grub-mkfont -s 32 -o /boot/grub/fonts/dejavu-mono-32.pf2 \
#   /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
GRUB_FONT=/boot/grub/fonts/dejavu-mono-32.pf2

# List all kernels in the main menu, not under "Advanced options", so picking
# one is just arrow keys
GRUB_DISABLE_SUBMENU=y
